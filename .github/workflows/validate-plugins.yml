name: Validate plugins

on:
  pull_request:
    paths:
      - ".cursor-plugin/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "**/plugin.json"
      - "schemas/**"
      - "examples/**"
      - "pstack/**"
      - "harness/**"
      - "scripts/**"
      - "cursor-team-kit/**"
      - "orchestrate/**"
      - "create-plugin/**"
      - "docs/**"
      - ".github/workflows/validate-plugins.yml"

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats fast-check@4.5.3

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs

      - name: Check generated pstack harness trees
        run: node scripts/generate-pstack-harness-trees.mjs --check

      - name: Check pstack docs
        run: node scripts/check-pstack-docs.mjs

      - name: Check feature-map contracts
        run: node scripts/check-feature-maps.mjs

      - name: Run search verification fixture
        run: node examples/search-verification/run.mjs --output "$RUNNER_TEMP/search-evidence"

      - name: Validate search evidence
        run: node scripts/validate-evidence.mjs --root "$RUNNER_TEMP/search-evidence" --manifest "$RUNNER_TEMP/search-evidence/evidence.json"

      - name: Test repository scripts
        run: node --test scripts/test/*.test.mjs

      - name: Test pstack skill scripts
        run: node --disable-warning=ExperimentalWarning --test pstack/skills/*/scripts/test/*.test.ts
