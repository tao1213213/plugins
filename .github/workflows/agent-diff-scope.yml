name: Agent Diff Scope

on:
  pull_request:

jobs:
  diff-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-save ajv

      - name: Check changed file scope
        run: node scripts/check-diff-scope.mjs --base "origin/${{ github.base_ref }}" --head HEAD --policy diff-scope-policy.json
