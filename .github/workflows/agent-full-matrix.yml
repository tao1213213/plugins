name: Agent Full Matrix

on:
  pull_request:
  workflow_dispatch:

jobs:
  node-gates:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats fast-check@4.5.3
      - name: Validate plugins
        run: node scripts/validate-plugins.mjs
      - name: Check docs
        run: node scripts/check-pstack-docs.mjs
      - name: Check generated harness
        run: node scripts/generate-pstack-harness-trees.mjs --check
      - name: Test repository scripts
        run: node --test scripts/test/*.test.mjs

  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pstack/skills/poteto-mode/scripts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

  evidence:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats
      - name: Run search verification
        run: node examples/search-verification/run.mjs --output "$RUNNER_TEMP/search-evidence"
      - name: Check evidence coverage and cleanup
        run: node scripts/check-verification-evidence.mjs --root "$RUNNER_TEMP/search-evidence" --manifest "$RUNNER_TEMP/search-evidence/evidence.json" --inventory examples/search-verification/surface-inventory.json

  diff-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-save ajv
      - name: Check changed file scope
        run: node scripts/check-diff-scope.mjs --base "origin/${{ github.base_ref }}" --head HEAD --policy diff-scope-policy.json

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-save ajv
      - name: Check architecture boundaries
        run: node scripts/check-architecture.mjs

  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats
      - name: Collect repository metrics
        run: node scripts/collect-repo-metrics.mjs --output "$RUNNER_TEMP/repo-metrics.json"
      - name: Check performance budget
        run: node scripts/check-performance-budget.mjs --metrics "$RUNNER_TEMP/repo-metrics.json"
      - name: Check exceptions
        run: node scripts/check-exceptions.mjs
      - name: Run rollback drill
        run: node scripts/rollback-drill.mjs --root "$RUNNER_TEMP"

  summary:
    needs: [node-gates, typescript, evidence, diff-scope, architecture, governance]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All agent engineering gates passed."
