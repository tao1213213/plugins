name: Agent TypeScript Gates

on:
  pull_request:
    paths:
      - "pstack/skills/poteto-mode/scripts/**"
      - "orchestrate/skills/orchestrate/scripts/**"
      - ".github/workflows/agent-typescript-gates.yml"

jobs:
  typescript:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: poteto-mode-tools
            working-directory: pstack/skills/poteto-mode/scripts
          - name: orchestrate
            working-directory: orchestrate/skills/orchestrate/scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test
